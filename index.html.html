<style>
:root{
  --bg:#E8EAED;--s1:rgba(255,255,255,.78);--s2:#EEF0F3;--line:rgba(5,5,7,.09);--line2:rgba(5,5,7,.17);
  --tx:#050507;--mu:#555A64;--mu2:#8A8F99;
  --teal:#00D2BE;--teal-t:#00877A;--teal-d:rgba(0,210,190,.14);--red:#D64545;--red-d:rgba(214,69,69,.1);--amb:#E0A030;--amb-t:#9C6410;--amb-d:rgba(224,160,48,.14);
  --chrome:linear-gradient(180deg,#3A3E48 0%,#050507 55%,#2A2D35 100%);
  --chrome-l:linear-gradient(180deg,#FFFFFF 0%,#D4D7DC 42%,#8E949D 54%,#C8CCD2 78%,#F2F3F5 100%);
  --bg-chrome:linear-gradient(135deg,#E8EAED 0%,#B0B4BB 34%,#F2F4F6 64%,#9A9EA8 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 400px at 85% -10%,rgba(0,210,190,.07),transparent 60%);z-index:0}
.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:22px 16px 90px}
h1,h2,h3,.bb{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.04em;line-height:1.05}
h2{font-size:26px}
h3{font-size:20px;margin-bottom:12px}
.lbl{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--mu);font-weight:600}
.chrome{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}
.tealc{color:var(--teal)}.redc{color:var(--red)}.ambc{color:var(--amb)}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mb{margin-bottom:14px}.mt{margin-top:14px}.mt2{margin-top:24px}
/* header */
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(180deg,#191B21,#0B0C10);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.mark span{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.06em}
.mark i{display:block;width:16px;height:2px;background:var(--teal);margin:1px auto 0;border-radius:1px}
header h1{font-size:30px}
.month{display:flex;align-items:center;gap:6px}
.month .cur{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.06em;min-width:150px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600;color:var(--mu);padding:4px 9px;border:1px solid var(--line2);border-radius:20px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mu2)}
.pill.ok::before{background:var(--teal)}.pill.warn::before{background:var(--amb)}
/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:6px 0 24px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.11em;font-weight:600;font-size:14px;color:var(--mu);background:none;border:0;padding:14px 13px 12px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;transition:color .15s}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);border-bottom-color:var(--teal)}
.sub{display:inline-flex;border:1px solid var(--line2);border-radius:8px;padding:3px;gap:3px;background:var(--s1)}
.sub button{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:13px;padding:8px 16px;border:0;border-radius:6px;background:none;color:var(--mu);cursor:pointer}
.sub button.on{background:linear-gradient(180deg,#22252D,#16181E);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.kpi .v{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.02em;line-height:1.05;margin-top:8px}
.kpi .d{font-size:12px;color:var(--mu);margin-top:2px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head p{color:var(--mu);font-size:14px;max-width:620px;margin-top:4px}
/* buttons */
.btn{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:13px;padding:10px 16px;border-radius:7px;cursor:pointer;border:1px solid #2E313B;color:var(--tx);background:linear-gradient(180deg,#1D1F26 0%,#121318 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.7);white-space:nowrap;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(1px)}
.btn.pri{color:#03110F;border-color:#29E8D5;background:linear-gradient(180deg,#46F2DF 0%,#00D2BE 52%,#00B09F 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.18),0 2px 12px rgba(0,210,190,.18)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.ghost{background:none;box-shadow:none;border-color:var(--line2)}
.ic{background:none;border:0;color:var(--mu2);cursor:pointer;padding:6px;border-radius:6px;font-size:15px;line-height:1}
.ic:hover{color:var(--tx);background:var(--s2)}
/* bars */
.bar{height:6px;background:#191B22;border-radius:3px;position:relative;overflow:visible}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:3px;max-width:100%;transition:width .4s}
.bar>s{position:absolute;top:-3px;bottom:-3px;width:2px;background:#C9CDD3;border-radius:1px;text-decoration:none}
.bar.big{height:10px;border-radius:5px}.bar.big>i{border-radius:5px}
/* rows */
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--mu);margin-top:1px}
.row .val{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.03em;text-align:right;white-space:nowrap}
.date{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-align:center;width:42px;line-height:1.05;color:var(--mu)}
.date b{display:block;font-size:20px;color:var(--tx);font-weight:600}
.date span{font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.chip{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--s2);border:1px solid var(--line2);color:var(--mu);margin-right:4px}
.chip.t{color:var(--teal);border-color:rgba(0,210,190,.3);background:var(--teal-d)}
.chip.r{color:var(--red);border-color:rgba(255,107,107,.3);background:var(--red-d)}
.chip.a{color:var(--amb);border-color:rgba(242,185,75,.3);background:var(--amb-d)}
.empty{padding:34px 10px;text-align:center;color:var(--mu);font-size:14px}
.empty b{display:block;font-family:'Bebas Neue',sans-serif;font-size:22px;font-weight:400;letter-spacing:.05em;color:var(--tx);margin-bottom:4px}
/* checks */
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:1.5px solid var(--line2);border-radius:6px;background:#0E0F14;cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.chk:checked{background:var(--teal);border-color:var(--teal)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #03110F;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.health li{list-style:none;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.health li:last-child{border:0}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700;margin-top:1px}
.dot.ok{background:var(--teal-d);color:var(--teal)}.dot.no{background:var(--amb-d);color:var(--amb)}.dot.na{background:var(--s2);color:var(--mu2)}
/* forms */
input,select,textarea{width:100%;background:#0D0E13;border:1px solid var(--line2);color:var(--tx);border-radius:7px;padding:10px 12px;font:inherit;font-size:15px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#868B95 50%),linear-gradient(135deg,#868B95 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.field{margin-bottom:12px}.field label{display:block;margin-bottom:6px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar>*{flex:1 1 140px;width:auto}
.toolbar input{flex:2 1 200px}
.inline-in{width:110px;padding:7px 9px;font-size:14px;text-align:right}
/* chart */
.chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .bars{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.chart .bars i{display:block;width:40%;max-width:18px;border-radius:3px 3px 0 0;min-height:2px}
.chart .rc{background:var(--teal)}.chart .dp{background:linear-gradient(180deg,#D4D7DC,#7B818A)}
.chart .m{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.chart .col.on .m{color:var(--tx)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* goals */
.goal{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--s1)}
.goal.done{border-color:rgba(0,210,190,.35)}
.goal h4{font-family:'Barlow';font-weight:600;font-size:16px;line-height:1.3}
.goal.done h4{color:var(--mu);text-decoration:line-through;text-decoration-color:var(--teal)}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.sug{font-size:13px;padding:7px 12px;border-radius:20px;border:1px dashed var(--line2);background:none;color:var(--mu);cursor:pointer;font-family:inherit}
.sug:hover{color:var(--teal);border-color:var(--teal)}
/* pie */
.pie-card{display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 18px}
.pie-wrap{width:min(100%,300px)}
.pie{width:100%;height:auto;display:block}
.pie path{transition:opacity .15s;cursor:pointer}
.pie:hover path{opacity:.55}.pie path:hover{opacity:1}
.pie .pl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;fill:#050507;pointer-events:none}
.pie-tot{text-align:center}
/* settle */
.settle{text-align:center;padding:26px 16px}
.settle .big{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:.02em;line-height:1}
.note{font-size:13px;color:var(--mu);background:var(--s2);border:1px solid var(--line);border-left:2px solid var(--teal);padding:12px 14px;border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--mu);font-weight:600}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tr.grp td{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.06em;padding-top:20px;color:var(--mu);border-bottom-color:var(--line2)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(2,2,4,.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.modal{background:var(--s1);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{font-size:24px;margin-bottom:16px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:#16181E;border:1px solid var(--line2);color:var(--tx);padding:11px 18px;border-radius:9px;font-size:14px;z-index:60;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
@media (max-width:640px){
  header h1{font-size:25px}
  .month .cur{min-width:120px;font-size:20px}
  .kpi .v{font-size:28px}
  .card{padding:15px}
  .row{gap:10px}
  .tbl{font-size:13px}
  .hide-m{display:none}
  .frow{grid-template-columns:1fr}
}

/* ====== utilidades ====== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; let s = String(v ?? '').replace(/[R$\s%]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const brl0 = n => (Number(n) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
const pc = (n, d=0) => (isFinite(n) ? n : 0).toLocaleString('pt-BR', {maximumFractionDigits:d, minimumFractionDigits:d}) + '%';
const sum = (arr, f = x => x.valor) => arr.reduce((a, x) => a + num(f(x)), 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const mesHoje = () => hojeISO().slice(0,7);
const addMes = (m, d) => { const [y, mm] = m.split('-').map(Number); const dt = new Date(y, mm-1+d, 1); return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0'); };
const mesNome = m => { const [y, mm] = m.split('-').map(Number); return MESES[mm-1] + ' ' + y; };
const mesCurto = m => MESES[Number(m.split('-')[1])-1].slice(0,3);
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600); }

const DONOS = ['Casal','Douglas','Marina'];
const CAT_REC = ['Salário','Pró-labore / Empresa','Freelance / Renda extra','Rendimentos','Reembolso','Outras receitas'];
const CAT_DESP = {
  'Moradia':'N','Contas da casa':'N','Mercado':'N','Transporte':'N','Saúde':'N','Educação':'N','Seguros':'N','Pets':'N','Impostos e taxas':'N',
  'Restaurantes e delivery':'D','Lazer':'D','Compras':'D','Assinaturas':'D','Viagens':'D','Cuidados pessoais':'D','Presentes':'D','Outros gastos':'D',

};
const GRUPO = {N:'Necessidades', D:'Desejos', F:'Futuro'};
const GRUPO_DESC = {N:'Moradia, contas, mercado, transporte, saúde', D:'Lazer, delivery, compras, assinaturas', F:'Reserva, investimentos, quitar dívidas e o que sobrar'};

const TIPOS_PAT = ['Reserva de emergência','Investimento','Conta corrente','Previdência','Bem (imóvel, carro)','Outros'];

/* ====== estado e armazenamento ====== */
const COLS = ['lancamentos','contas','dividas','patrimonio','objetivos','cartoes','compras','emp'];
const DEF_CFG = {orcamento:{}, mesesReserva:6, divisao:'igual', estrategia:'avalanche', acertados:{}};
const st = {mode:'loading', db:null, data:Object.fromEntries(COLS.map(c => [c, []])), cfg:JSON.parse(JSON.stringify(DEF_CFG))};
let mes = mesHoje();
let tab = 'geral', objTab = 'mensal';
const flt = {tipo:'', pessoa:'', cat:'', q:''};
try { tab = localStorage.getItem('dm-tab') || 'geral'; objTab = localStorage.getItem('dm-obj') || 'mensal'; } catch(e){}

function setSync(txt, cls){ const s = $('#sync'); s.textContent = txt; s.className = 'pill ' + (cls || ''); }
function loadLocal(){ try { const j = JSON.parse(localStorage.getItem('dm-fin') || 'null'); if (j){ COLS.forEach(c => st.data[c] = Array.isArray(j.data?.[c]) ? j.data[c] : []); st.cfg = {...DEF_CFG, ...(j.cfg || {})}; } } catch(e){} }
function saveLocal(){ if (st.mode !== 'local') return; try { localStorage.setItem('dm-fin', JSON.stringify({data:st.data, cfg:st.cfg})); } catch(e){ toast('Não foi possível salvar neste navegador.'); } }
function fail(e){ const c = e && e.code; if (c === 'invalid_argument') toast('Sem permissão para editar. Peça acesso de Colaborador.'); else if (c === 'quota_exceeded') toast('Limite de armazenamento atingido. Apague registros antigos.'); else toast('Não foi possível salvar. Tente de novo.'); }
function clean(o){ const c = JSON.parse(JSON.stringify(o)); delete c.id; return c; }

async function addItem(col, obj){
  const id = uid(); const body = clean({...obj, criado:Date.now()});
  if (st.mode === 'db'){ try { await st.db.doc(col + '/' + id).set(body); return id; } catch(e){ fail(e); return null; } }
  st.data[col].push({...body, id}); saveLocal(); render(); return id;
}
async function setItem(col, id, obj){
  const body = clean(obj);
  if (st.mode === 'db'){ try { await st.db.doc(col + '/' + id).set(body); return true; } catch(e){ fail(e); return false; } }
  const i = st.data[col].findIndex(x => x.id === id); if (i >= 0) st.data[col][i] = {...body, id}; saveLocal(); render(); return true;
}
async function delItem(col, id){
  if (st.mode === 'db'){ try { await st.db.doc(col + '/' + id).delete(); return true; } catch(e){ fail(e); return false; } }
  st.data[col] = st.data[col].filter(x => x.id !== id); saveLocal(); render(); return true;
}
let cfgTimer = null;
function saveCfg(){
  render();
  if (st.mode === 'db'){ clearTimeout(cfgTimer); cfgTimer = setTimeout(async () => { cfgTimer = null; try { await st.db.doc('config/geral').set(JSON.parse(JSON.stringify(st.cfg))); } catch(e){ fail(e); } }, 700); }
  else saveLocal();
}
const get = (col, id) => st.data[col].find(x => x.id === id);

async function init(){
  render();
  let db = null;
  try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch(e){ db = null; }
  if (!db){ st.mode = 'local'; loadLocal(); setSync('Salvo neste navegador', 'warn'); render(); return; }
  st.db = db; st.mode = 'db';
  let pend = COLS.length + 1, rt = null;
  const timer = setTimeout(() => setSync('Sem conexão com os dados', 'warn'), 10000);
  const ready = new Set();
  const mark = (k, snap) => { if (!snap.metadata.fromCache && !ready.has(k)){ ready.add(k); if (ready.size === pend){ clearTimeout(timer); setSync('Sincronizado', 'ok'); } } };
  const sched = () => { cancelAnimationFrame(rt); rt = requestAnimationFrame(render); };
  COLS.forEach(c => {
    db.collection(c).onSnapshot(snap => { st.data[c] = snap.docs.map(d => ({...d.data(), id:d.id})); mark(c, snap); sched(); },
      () => { clearTimeout(timer); setSync('Erro ao carregar', 'warn'); });
  });
  db.doc('config/geral').onSnapshot(snap => { if (!cfgTimer && snap.exists) st.cfg = {...DEF_CFG, ...JSON.parse(JSON.stringify(snap.data()))}; mark('cfg', snap); sched(); },
    () => { clearTimeout(timer); setSync('Erro ao carregar', 'warn'); });
}

/* ====== cálculos ====== */
const lancMes = m => st.data.lancamentos.filter(l => (l.data || '').slice(0,7) === m).concat(parcelasCartao(m));
const mesDiff = (a, b) => { const [y1,m1] = a.split('-').map(Number), [y2,m2] = b.split('-').map(Number); return (y2-y1)*12 + (m2-m1); };
function fatura1(cp, c){
  const fech = parseInt(c.fechamento) || 1, venc = parseInt(c.vencimento) || 10;
  const d = cp.data || hojeISO(); let close = d.slice(0,7);
  if (Number(d.slice(8,10)) >= fech) close = addMes(close, 1);
  return venc > fech ? close : addMes(close, 1);
}
function parcelasCartao(m, cartaoId){
  const out = [];
  st.data.compras.forEach(cp => {
    if (cartaoId && cp.cartaoId !== cartaoId) return;
    const c = get('cartoes', cp.cartaoId); if (!c) return;
    const n = Math.max(parseInt(cp.parcelas) || 1, 1), i = mesDiff(fatura1(cp, c), m);
    if (i < 0 || i >= n) return;
    out.push({id:cp.id + '_' + i, compraId:cp.id, cartaoId:c.id, virtual:true, tipo:'despesa',
      data:m + '-' + String(Math.min(parseInt(c.vencimento) || 10, 28)).padStart(2,'0'), dataCompra:cp.data,
      desc:(cp.desc || cp.cat) + (n > 1 ? ` (${i+1}/${n})` : ''), valor:Math.round(num(cp.valor)/n*100)/100,
      cat:cp.cat, de:cp.de || 'Casal', pagoPor:c.titular || 'Douglas', forma:'Cartão ' + (c.nome || ''), criado:cp.criado});
  });
  return out;
}
const faturaValor = (c, m) => sum(parcelasCartao(m, c.id));
function faturaStatus(c, m){
  if (c.pagas && c.pagas[m]) return 'pago';
  const venc = m + '-' + String(Math.min(parseInt(c.vencimento)||10, 28)).padStart(2,'0'), hoje = hojeISO();
  if (venc < hoje) return 'vencida';
  return (new Date(venc) - new Date(hoje))/864e5 <= 5 ? 'proxima' : 'aberta';
}
function contaValorMes(c, m){ const lid = c.pagos && c.pagos[m]; const l = lid && get('lancamentos', lid); return l ? num(l.valor) : num(c.valor); }
function tot(m){
  const L = lancMes(m);
  const R = L.filter(l => l.tipo === 'receita'), D = L.filter(l => l.tipo === 'despesa');
  const r = sum(R), d = sum(D), g = {N:0, D:0, F:0}, porCat = {};
  D.forEach(l => { const v = num(l.valor); g[CAT_DESP[l.cat] || 'D'] += v; porCat[l.cat || 'Outros gastos'] = (porCat[l.cat || 'Outros gastos'] || 0) + v; });
  const futuro = r - g.N - g.D;
  return {L, R, D, r, d, s:r-d, g, porCat, futuro};
}
function custoEssencial(){
  const vals = [0,1,2,3,4,5].map(i => tot(addMes(mes, -i)).g.N).filter(v => v > 0).slice(0,3);
  if (vals.length) return vals.reduce((a,b) => a+b, 0) / vals.length;
  return Object.entries(st.cfg.orcamento || {}).filter(([c]) => CAT_DESP[c] === 'N').reduce((a,[,v]) => a + num(v), 0);
}
const totalReserva = () => sum(st.data.patrimonio.filter(p => p.tipo === 'Reserva de emergência'));
const totalDividas = () => sum(st.data.dividas, d => d.saldo);
const totalParcelas = () => sum(st.data.dividas, d => d.parcela);
function mesesQuitar(d){
  const pv = num(d.saldo), r = num(d.juros)/100, p = num(d.parcela);
  if (pv <= 0) return 0; if (p <= 0) return Infinity;
  if (r === 0) return Math.ceil(pv/p);
  if (p <= pv*r) return Infinity;
  return Math.ceil(-Math.log(1 - r*pv/p) / Math.log(1+r));
}
function contaStatus(c, m){
  if (c.pagos && c.pagos[m]) return 'pago';
  const dia = Math.min(Math.max(parseInt(c.dia) || 1, 1), 28);
  const hoje = hojeISO(), venc = m + '-' + String(dia).padStart(2,'0');
  if (venc < hoje) return 'vencida';
  const diff = (new Date(venc) - new Date(hoje)) / 864e5;
  return diff <= 5 ? 'proxima' : 'aberta';
}
function acerto(m){
  const D = lancMes(m).filter(l => l.tipo === 'despesa');
  const conj = D.filter(l => (l.de || 'Casal') === 'Casal');
  const total = sum(conj);
  const pago = {Douglas: sum(conj.filter(l => l.pagoPor === 'Douglas')), Marina: sum(conj.filter(l => l.pagoPor === 'Marina'))};
  const semPagador = sum(conj.filter(l => !PESSOAS.includes(l.pagoPor)));
  const R = lancMes(m).filter(l => l.tipo === 'receita');
  const renda = {Douglas: sum(R.filter(l => l.de === 'Douglas')), Marina: sum(R.filter(l => l.de === 'Marina'))};
  const rt = renda.Douglas + renda.Marina;
  const pD = st.cfg.divisao === 'renda' && rt > 0 ? renda.Douglas/rt : .5;
  const parte = {Douglas: (total - semPagador)*pD, Marina: (total - semPagador)*(1-pD)};
  const cruz = {DparaM: sum(D.filter(l => l.de === 'Marina' && l.pagoPor === 'Douglas')), MparaD: sum(D.filter(l => l.de === 'Douglas' && l.pagoPor === 'Marina'))};
  const saldoD = (pago.Douglas - parte.Douglas) + cruz.DparaM - cruz.MparaD;
  return {total, pago, parte, renda, pD, cruz, saldoD, semPagador, conj};
}

/* ====== render ====== */
const TABS = {geral:'Visão Geral', pizza:'Gráficos', lanc:'Lançamentos', contas:'Contas do Mês', cartoes:'Cartões', orc:'Orçamento', acerto:'Acerto do Casal', dividas:'Dívidas', patri:'Patrimônio', obj:'Objetivos', amora:'Amora Studio', apex:'Apex'};
function render(){
  $('#mesLabel').textContent = mesNome(mes);
  $('#tabs').innerHTML = Object.entries(TABS).map(([k,v]) => `<button class="tab ${k===tab?'on':''}" data-act="tab" data-k="${k}">${v}</button>`).join('');
  const v = $('#view');
  const fn = {geral:vGeral, pizza:vPizza, lanc:vLanc, contas:vContas, cartoes:vCartoes, orc:vOrc, acerto:vAcerto, dividas:vDividas, patri:vPatri, obj:vObj, amora:() => vEmp('amora'), apex:() => vEmp('apex')}[tab] || vGeral;
  const active = document.activeElement, aid = active && active.id, sel = aid && active.selectionStart;
  v.innerHTML = fn();
  if (tab === 'lanc') renderLancList();
  if (aid){ const el = document.getElementById(aid); if (el && el !== active){ el.focus(); try { el.setSelectionRange(sel, sel); } catch(e){} } }
}
const kpi = (l, v, cls='', d='') => `<div class="card kpi"><div class="lbl">${l}</div><div class="v ${cls}">${v}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`;
const head = (t, p, acts='') => `<div class="sec-head"><div><h2>${t}</h2>${p ? `<p>${p}</p>` : ''}</div><div class="flex">${acts}</div></div>`;
const emptyBox = (t, p) => `<div class="empty"><b>${t}</b>${p}</div>`;

/* --- Visão geral --- */
function vGeral(){
  const t = tot(mes), prev = tot(addMes(mes, -1));
  const delta = (a, b) => b > 0 ? ((a-b)/b*100) : null;
  const dd = delta(t.d, prev.d);
  const fut = t.r > 0 ? t.futuro/t.r*100 : 0;
  let h = `<div class="grid g4 mb">
    ${kpi('Receitas', brl(t.r), 'tealc', `${t.R.length} entrada(s)`)}
    ${kpi('Despesas', brl(t.d), '', dd === null ? 'sem base no mês anterior' : `${dd>0?'+':''}${pc(dd)} vs ${mesCurto(addMes(mes,-1))}`)}
    ${kpi('Saldo do mês', brl(t.s), t.s < 0 ? 'redc' : 'chrome', t.s < 0 ? 'gastaram mais do que entrou' : 'receitas menos despesas')}
    ${kpi('Destinado ao futuro', t.r > 0 ? pc(fut) : '0%', fut >= 20 ? 'tealc' : (t.r>0?'ambc':''), 'meta: 20% ou mais da renda')}
  </div>`;

  // 50/30/20
  const g = {N:t.g.N, D:t.g.D, F:Math.max(t.futuro,0)};
  h += `<div class="grid g2 mb"><div class="card"><h3>Regra 50 / 30 / 20</h3>`;
  if (t.r <= 0) h += emptyBox('Sem receitas no mês', 'Lance as receitas para ver a divisão da renda.');
  else ['N','D','F'].forEach(k => {
    const p = g[k]/t.r*100, ok = k === 'F' ? p >= IDEAL[k] : p <= IDEAL[k];
    h += `<div class="mb"><div class="between"><div><b style="font-weight:600">${GRUPO[k]}</b> <span class="mu xs">ideal ${k==='F'?'≥':'≤'} ${IDEAL[k]}%</span></div><div class="bb" style="font-size:20px"><span class="${ok?'':'ambc'}">${pc(p)}</span></div></div>
      <div class="bar"><i style="width:${Math.min(p,100)}%;background:${ok?'var(--teal)':'var(--amb)'}"></i><s style="left:${IDEAL[k]}%"></s></div>
      <div class="between xs mu" style="margin-top:4px"><span>${GRUPO_DESC[k]}</span><span>${brl(g[k])}</span></div></div>`;
  });
  h += `</div>`;

  // Categorias
  const cats = Object.entries(t.porCat).sort((a,b) => b[1]-a[1]);
  const max = cats.length ? cats[0][1] : 1;
  h += `<div class="card"><h3>Para onde foi o dinheiro</h3>`;
  if (!cats.length) h += emptyBox('Nenhuma despesa', 'As despesas do mês aparecem aqui por categoria.');
  else cats.slice(0,8).forEach(([c,v]) => {
    const orc = num(st.cfg.orcamento?.[c]); const over = orc > 0 && v > orc;
    const w = orc > 0 ? Math.min(v/Math.max(orc, v)*100, 100) : v/max*100;
    h += `<div class="mb"><div class="between sm"><span>${esc(c)}</span><span><b>${brl(v)}</b> <span class="mu xs">${pc(v/t.d*100)}</span></span></div>
      <div class="bar" style="margin-top:5px"><i style="width:${w}%;background:${over?'var(--red)':'var(--teal)'}"></i>${orc>0?`<s style="left:${Math.min(orc/Math.max(orc,v)*100,100)}%"></s>`:''}</div>
      ${over?`<div class="xs redc" style="margin-top:3px">${brl(v-orc)} acima do orçamento</div>`:''}</div>`;
  });
  h += `</div></div>`;

  // 6 meses + saúde
  const ms = [5,4,3,2,1,0].map(i => addMes(mes, -i)), tt = ms.map(tot);
  const mx = Math.max(1, ...tt.map(x => Math.max(x.r, x.d)));
  h += `<div class="grid g2 mb"><div class="card"><div class="between"><h3 style="margin:0">Últimos 6 meses</h3><div class="legend"><span><i style="background:var(--teal)"></i>Receitas</span><span><i style="background:#2A2D35"></i>Despesas</span></div></div>
    <div class="chart">${ms.map((m,i) => `<div class="col ${m===mes?'on':''}" title="${mesNome(m)}: receitas ${brl(tt[i].r)}, despesas ${brl(tt[i].d)}"><div class="bars"><i class="rc" style="height:${tt[i].r/mx*100}%"></i><i class="dp" style="height:${tt[i].d/mx*100}%"></i></div><div class="m">${mesCurto(m)}</div></div>`).join('')}</div>
    <div class="xs mu mt">Saldo acumulado no período: <b class="${sum(tt,x=>x.s)<0?'redc':'tealc'}">${brl(sum(tt,x=>x.s))}</b></div></div>`;

  // saúde
  const ce = custoEssencial(), res = totalReserva(), meta = ce*num(st.cfg.mesesReserva||6);
  const parc = totalParcelas();
  const estour = Object.entries(t.porCat).filter(([c,v]) => num(st.cfg.orcamento?.[c]) > 0 && v > num(st.cfg.orcamento[c]));
  const venc = st.data.contas.filter(c => contaStatus(c, mes) === 'vencida').concat(st.data.cartoes.filter(c => faturaValor(c, mes) > 0 && faturaStatus(c, mes) === 'vencida'));
  const checks = [
    [t.r > 0 ? fut >= 20 : null, 'Pelo menos 20% da renda vai para o futuro', t.r > 0 ? `Hoje: ${pc(fut)}` : 'Lance as receitas do mês'],
    [t.r > 0 ? t.g.N/t.r*100 <= 50 : null, 'Necessidades até 50% da renda', t.r > 0 ? `Hoje: ${pc(t.g.N/t.r*100)}` : 'Lance as receitas do mês'],
    [meta > 0 ? res >= meta : null, `Reserva de emergência de ${num(st.cfg.mesesReserva||6)} meses`, meta > 0 ? `${brl0(res)} de ${brl0(meta)} (${ce>0?(res/ce).toLocaleString('pt-BR',{maximumFractionDigits:1}):0} meses cobertos)` : 'Defina o custo essencial no orçamento'],
    [t.r > 0 ? parc/t.r*100 <= 30 : (parc === 0 ? true : null), 'Parcelas de dívidas até 30% da renda', parc === 0 ? 'Nenhuma dívida cadastrada' : (t.r > 0 ? `Hoje: ${pc(parc/t.r*100)} (${brl(parc)}/mês)` : `${brl(parc)}/mês`)],
    [Object.keys(st.cfg.orcamento||{}).length ? estour.length === 0 : null, 'Todas as categorias dentro do orçamento', estour.length ? estour.map(([c]) => c).join(', ') + ' acima' : (Object.keys(st.cfg.orcamento||{}).length ? 'Tudo dentro do planejado' : 'Monte o orçamento na aba Orçamento')],
    [st.data.contas.length || st.data.cartoes.length ? venc.length === 0 : null, 'Contas e faturas em dia', venc.length ? `${venc.length} vencida(s) sem pagamento` : (st.data.contas.length || st.data.cartoes.length ? 'Nenhuma conta vencida' : 'Cadastre as contas do mês')],
  ];
  const okN = checks.filter(c => c[0] === true).length, valid = checks.filter(c => c[0] !== null).length;
  h += `<div class="card"><div class="between"><h3 style="margin:0">Saúde financeira</h3><div class="bb ${okN===valid&&valid?'tealc':'chrome'}" style="font-size:26px">${okN}/${checks.length}</div></div>
    <ul class="health mt">${checks.map(([ok,t1,t2]) => `<li><span class="dot ${ok===null?'na':ok?'ok':'no'}">${ok===null?'·':ok?'✓':'!'}</span><div><div style="font-weight:500">${t1}</div><div class="xs mu">${esc(t2)}</div></div></li>`).join('')}</ul></div></div>`;

  // contas a vencer + objetivos
  const abertas = st.data.contas.filter(c => contaStatus(c, mes) !== 'pago').sort((a,b) => num(a.dia)-num(b.dia));
  const objs = st.data.objetivos.filter(o => (o.escopo === 'mensal' && o.periodo === mes) || (o.escopo === 'anual' && o.periodo === mes.slice(0,4)));
  h += `<div class="grid g2"><div class="card"><div class="between"><h3 style="margin:0">Contas a pagar no mês</h3><button class="btn sm ghost" data-act="tab" data-k="contas">Ver todas</button></div><div class="list mt">`;
  const fats = st.data.cartoes.filter(c => faturaValor(c, mes) > 0 && faturaStatus(c, mes) !== 'pago');
  const pend = abertas.map(c => ({act:'pagar', id:c.id, nome:c.nome + (c.tipo==='variavel'?' (variável)':''), dia:num(c.dia), s:contaStatus(c, mes), v:num(c.valor)}))
    .concat(fats.map(c => ({act:'pagar-fat', id:c.id, nome:'Fatura ' + c.nome, dia:num(c.vencimento), s:faturaStatus(c, mes), v:faturaValor(c, mes)}))).sort((a,b) => a.dia - b.dia);

/* --- Gráficos (pizza) --- */
let pzModo = 'cat', pzPer = 'mes';
const PZ_CORES = ['#00D2BE','#050507','#00877A','#8A8F99','#7CEFE2','#E0A030','#3A3E48','#B7F7EF'];
function pieSvg(items, total){
  const R = 100, C = 110; let a0 = -Math.PI/2, out = '';
  if (items.length === 1) return `<svg viewBox="0 0 220 220" class="pie"><circle cx="${C}" cy="${C}" r="${R}" fill="${items[0].cor}"><title>${esc(items[0].nome)}: ${brl(items[0].v)} (100%)</title></circle></svg>`;
  items.forEach(it => {
    const ang = it.v/total*Math.PI*2, a1 = a0 + ang;
    const x0 = C + R*Math.cos(a0), y0 = C + R*Math.sin(a0), x1 = C + R*Math.cos(a1), y1 = C + R*Math.sin(a1);
    out += `<path d="M${C},${C} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${ang>Math.PI?1:0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${it.cor}" stroke="#F7F8FA" stroke-width="2" stroke-linejoin="round"><title>${esc(it.nome)}: ${brl(it.v)} (${pc(it.v/total*100,1)})</title></path>`;
    if (it.v/total >= .06){ const am = (a0+a1)/2; out += `<text x="${(C+R*.64*Math.cos(am)).toFixed(1)}" y="${(C+R*.64*Math.sin(am)).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" class="pl" style="fill:${['#050507','#00877A','#3A3E48'].includes(it.cor)?'#F2F3F5':'#050507'}">${pc(it.v/total*100)}</text>`; }
    a0 = a1;
  });
  return `<svg viewBox="0 0 220 220" class="pie">${out}</svg>`;
}
function vPizza(){
  const ms = pzPer === 'mes' ? [mes] : Array.from({length:12}, (_,i) => mes.slice(0,4) + '-' + String(i+1).padStart(2,'0'));
  const D = ms.flatMap(m => lancMes(m)).filter(l => l.tipo === 'despesa');
  const total = sum(D), agg = {};
  D.forEach(l => {
    const k = pzModo === 'cat' ? (l.cat || 'Outros gastos') : pzModo === 'grupo' ? GRUPO[CAT_DESP[l.cat] || 'D'] : (l.de || 'Casal');
    agg[k] = (agg[k] || 0) + num(l.valor);
  });
  let arr = Object.entries(agg).map(([nome, v]) => ({nome, v})).filter(x => x.v > 0).sort((a,b) => b.v - a.v);
  if (arr.length > 8){ const resto = arr.slice(7); arr = arr.slice(0,7).concat([{nome:`Outras (${resto.length})`, v:sum(resto, x => x.v), outros:resto}]); }
  arr.forEach((x,i) => x.cor = x.outros ? '#C4C8CE' : PZ_CORES[i % PZ_CORES.length]);
  const per = pzPer === 'mes' ? mesNome(mes) : 'Ano de ' + mes.slice(0,4);
  const seg = (k, v, lbl, cur) => `<button class="${cur===v?'on':''}" data-act="${k}" data-v="${v}">${lbl}</button>`;
  let h = head('Gráficos', `Como as despesas se dividem em ${per}. Toque numa fatia para ver o valor.`,
    `<div class="sub">${seg('pzper','mes','Mês',pzPer)}${seg('pzper','ano','Ano',pzPer)}</div>
     <div class="sub">${seg('pzmodo','cat','Categorias',pzModo)}${seg('pzmodo','grupo','50/30/20',pzModo)}${seg('pzmodo','pessoa','Pessoa',pzModo)}</div>`);
  if (!arr.length) return h + `<div class="card">${emptyBox('Nenhuma despesa', `Lance despesas em ${per} para ver o gráfico.`)}</div>`;
  h += `<div class="grid g2"><div class="card pie-card"><div class="pie-wrap">${pieSvg(arr, total)}</div>
    <div class="pie-tot"><div class="lbl">Total gasto</div><div class="bb chrome" style="font-size:32px">${brl(total)}</div><div class="xs mu">${D.length} despesa(s) · ${arr.length} fatia(s)</div></div></div>
    <div class="card"><h3>${pzModo==='cat'?'Por categoria':pzModo==='grupo'?'Necessidades, desejos e futuro':'Por pessoa'}</h3><div class="list">`;
  h += arr.map(x => `<div class="row" style="grid-template-columns:auto 1fr auto"><i style="width:12px;height:12px;border-radius:3px;background:${x.cor};display:block"></i>
      <div style="min-width:0"><div class="t">${esc(x.nome)}</div>${x.outros?`<div class="meta">${esc(x.outros.map(o => o.nome).join(', '))}</div>`:''}
      <div class="bar" style="margin-top:6px"><i style="width:${x.v/arr[0].v*100}%;background:${x.cor}"></i></div></div>
      <div style="text-align:right"><div class="val">${brl(x.v)}</div><div class="xs mu">${pc(x.v/total*100,1)}</div></div></div>`).join('');
  h += `</div>${pzModo==='grupo'?'<div class="xs mu mt">Referência: Necessidades até 50%, Desejos até 30% e Futuro 20% ou mais da renda. Aqui o Futuro considera só o que foi lançado como despesa (reserva, investimentos, parcelas).</div>':''}</div></div>`;
  return h;

    case 'del': confirmar(b.dataset.col === 'cartoes' ? 'Excluir este cartão e todas as compras lançadas nele?' : b.dataset.col === 'compras' ? 'Excluir esta compra? Todas as parcelas dela saem das faturas.' : 'Excluir este item?', async () => {
        const col = b.dataset.col, it = get(col, id);

        const inp = $('#modal [name=valor]'); if (inp) inp.placeholder = 'estimativa: ' + brl(c.valor);
        break; }
      busy = true; try { await pagarConta(c, num(c.valor)); } finally { busy = false; render(); }
      break; }
    case 'sugerir-orc': {
      const ms = [1,2,3].map(i => tot(addMes(mes,-i))).filter(t => t.d > 0);
      if (!ms.length){ toast('Sem histórico dos últimos 3 meses.'); break; }
      const o = {}; Object.keys(CAT_DESP).forEach(c => { const v = ms.reduce((a,t) => a + (t.porCat[c]||0), 0)/ms.length; if (v > 0) o[c] = Math.ceil(v/10)*10; });
      confirmar(`Preencher o orçamento com a média dos últimos ${ms.length} mês(es)? Os valores atuais serão substituídos.`, () => { st.cfg.orcamento = o; saveCfg(); toast('Orçamento sugerido.'); });
      break; }
    case 'divisao': st.cfg.divisao = b.dataset.v; saveCfg(); break;
    case 'estrategia': st.cfg.estrategia = b.dataset.v; saveCfg(); break;
    case 'acertar': st.cfg.acertados = {...(st.cfg.acertados||{}), [mes]:{valor:num(b.dataset.v), em:hojeISO().split('-').reverse().join('/')}}; saveCfg(); toast('Mês marcado como acertado.'); break;
    case 'desacertar': { const ac = {...(st.cfg.acertados||{})}; delete ac[mes]; st.cfg.acertados = ac; saveCfg(); break; }
    case 'pagar-div': {
      const d = get('dividas', id); if (!d) break;
      const juros = num(d.saldo)*num(d.juros)/100;
      openForm('Pagar ' + d.credor, [{k:'valor',l:'Valor pago (R$)',t:'money',req:true},{k:'data',l:'Data',t:'date',def:mes===mesHoje()?hojeISO():mes+'-10'},{k:'pagoPor',l:'Quem pagou',t:'select',o:PESSOAS}], {valor:d.parcela}, async v => {
        const val = num(v.valor); if (val <= 0){ toast('Informe o valor.'); return false; }
        const novo = Math.max(num(d.saldo) + juros - val, 0);
        const lid = await addItem('lancamentos', {tipo:'despesa', data:v.data, desc:'Parcela ' + d.credor, valor:val, cat:'Parcelas de dívidas', de:d.de||'Casal', pagoPor:v.pagoPor, forma:''});
        if (!lid) return false;
        await setItem('dividas', id, {...d, saldo:Math.round(novo*100)/100});
        toast(`Saldo atualizado para ${brl(novo)} (juros do mês considerados).`);
      });
      break; }
    case 'pzper': pzPer = b.dataset.v; render(); break;
    case 'pzmodo': pzModo = b.dataset.v; render(); break;
    case 'objtab': objTab = b.dataset.v; try{localStorage.setItem('dm-obj', objTab)}catch(x){} render(); break;
    case 'sug': { const s = SUG[objTab][Number(b.dataset.i)]; formObj(null, {titulo:s[0], cat:s[1], alvo:s[2]?num(s[2]):'', unidade:'R$', escopo:objTab}); break; }
    case 'done-obj': { const o = get('objetivos', id); if (o) await setItem('objetivos', id, {...o, done:!o.done}); break; }
    case 'aporte': {
      const inp = document.getElementById('ap-' + id), v = num(inp && inp.value), o = get('objetivos', id);
      if (!o || !v){ toast('Digite um valor para somar.'); break; }
      const at = num(o.atual) + v; await setItem('objetivos', id, {...o, atual:at, done: num(o.alvo) > 0 && at >= num(o.alvo) ? true : !!o.done}); toast('Progresso atualizado.');
      break; }
    case 'copiar-obj': {
      const ant = addMes(mes, -1), src = st.data.objetivos.filter(o => o.escopo === 'mensal' && o.periodo === ant);
      if (!src.length){ toast('O mês anterior não tem objetivos.'); break; }
      const ja = new Set(st.data.objetivos.filter(o => o.escopo === 'mensal' && o.periodo === mes).map(o => o.titulo));
      let n = 0; for (const o of src){ if (ja.has(o.titulo)) continue; const {id:_, criado, ...r} = o; await addItem('objetivos', {...r, periodo:mes, atual:0, done:false, prazo:''}); n++; }
      toast(n ? `${n} objetivo(s) copiado(s).` : 'Esses objetivos já estão neste mês.');
      break; }
    case 'backup': {
      const txt = JSON.stringify({versao:1, exportado:new Date().toISOString(), data:st.data, cfg:st.cfg});
      try { await navigator.clipboard.writeText(txt); toast('Backup copiado. Cole em uma nota ou arquivo seguro.'); }
      catch(x){ openForm('Backup', [{k:'b',l:'Copie o texto abaixo',t:'textarea'}], {b:txt}, () => true); }
      break; }
    case 'restore': openForm('Restaurar backup', [{k:'b',l:'Cole aqui o texto do backup',t:'textarea'}], {}, async v => {
      let j; try { j = JSON.parse(v.b); } catch(x){ toast('Texto de backup inválido.'); return false; }
      if (!j || !j.data){ toast('Texto de backup inválido.'); return false; }
      let n = 0;
      for (const c of COLS){ for (const it of (j.data[c] || [])){ if (!it || typeof it !== 'object') continue; if (it.id && get(c, it.id)) continue; const id = it.id || uid();
        if (st.mode === 'db'){ try { await st.db.doc(c + '/' + id).set(clean(it)); n++; } catch(x){ fail(x); return false; } } else { st.data[c].push({...clean(it), id}); n++; } } }
      if (j.cfg) { st.cfg = {...DEF_CFG, ...j.cfg}; saveCfg(); } else saveLocal();
      render(); toast(`${n} registro(s) restaurado(s).`);
    }); break;
  }
});
function confirmar(msg, fn){
  openForm('Confirmar', [], {}, async () => { await fn(); });
  $('#modal h3').insertAdjacentHTML('afterend', `<p class="mu">${esc(msg)}</p>`);
}

// filtros e campos inline
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-q'){ flt.q = t.value; renderLancList(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-tipo'){ flt.tipo = t.value; renderLancList(); }
  if (t.id === 'f-pessoa'){ flt.pessoa = t.value; renderLancList(); }
  if (t.id === 'f-cat'){ flt.cat = t.value; renderLancList(); }
  if (t.dataset.act === 'orc'){ const o = {...(st.cfg.orcamento||{})}; const v = num(t.value); if (v > 0) o[t.dataset.cat] = v; else delete o[t.dataset.cat]; st.cfg.orcamento = o; saveCfg(); }
  if (t.dataset.act === 'meses-res'){ const v = Math.min(Math.max(parseInt(t.value)||6, 1), 36); st.cfg.mesesReserva = v; saveCfg(); }
});

init();
</script>
